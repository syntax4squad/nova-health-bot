<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SwasthyaSaathi AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span> SwasthyaSaathi AI — Admin</div>
  <div class="topbar-actions"><a class="btn btn-outline" href="{{ url_for('index') }}">Back to app</a></div>
</div>

<div class="auth-wrap">
  <h2>Admin console</h2>
  <p style="color:var(--muted); font-size:0.9rem;">Credentials are set via ADMIN_EMAIL / ADMIN_PASSWORD in the .env file.</p>
  <label for="email">Admin email</label>
  <input type="text" id="email" placeholder="admin@swasthyasaathi.local">
  <label for="password">Password</label>
  <input type="password" id="password">
  <div class="auth-error" id="err"></div>
  <button class="btn btn-primary" id="loginBtn">Log in</button>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if (res.ok) { window.location.href = '/admin/dashboard'; }
  else { err.textContent = data.error || 'Login failed.'; }
});
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
